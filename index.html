<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="style.css">

<body>
    "
    <div class="overallbox">
        

    <div class="signupsec">
    <div class="form-section">
        <h1>GET STARTED NOW!</h1>
        <form>
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email">
            <label for="password">password</label>
            <input type="password" id="password" placeholder="Enter a strong password">

            <div class="terms">
                <input type="checkbox" id="terms">
                <label for="terms">
                    I agree to the <a href="#">terms and conditions</a>
                    </label>
                    </div>
                    <button type="submit" class="signup-btn"></Sign-up></button>

        </form>

        <div class="or">Or</div>

        <div class="social-buttons">
            <button type="button">
                <img src="https://www.google.com/favicon.ico" alt="Google"> sign in with google
            </button>

        <button type="button" class="applelogo">
            <img src="assets/apple-black-logo-svgrepo-com.svg" alt="Apple"> Sign in with apple
        </button>
        </div>

        <p class="login"> 
            Have an Account? <a href="#">Sign in<a/>
        </p>
        
    </div>

    <div class="image-section">
        <img src="assets/3D Dark Chrome Icon Collection - Icoon_co.jpg" alt="Signup background image">
    </div>

    </div>
